server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/swen3db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    # services map entities to DTOs inside their transaction, so no lazy loading happens
    # while the response is written; keeping the session open until then is not needed
    open-in-view: false
  servlet:
    multipart:
      # same limit as nginx (client_max_body_size 50M); Spring's default of 1MB rejects most real PDFs with 413
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    web:
      pageable:
        max-page-size: 100 # ?size= above this is capped to 100
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  cors:
    # origins (scheme://host:port) allowed to call /api/** from a browser, comma-separated
    # localhost = Web UI behind nginx (port 80), 5173 = local UI dev server
    allowed-origins: http://localhost,http://localhost:5173
  rabbitmq:
    ocr-queue: ocr.queue

logging:
  level:
    com.swen3: INFO          # DEBUG also logs every read request (lists, single documents)
    org.hibernate.SQL: INFO  # DEBUG prints every SQL statement through the logger (instead of show-sql)

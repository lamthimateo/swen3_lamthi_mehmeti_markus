server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/swen3db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        max-page-size: 100   # ?size= above this is capped to 100

app:
  cors:
    # origins (scheme://host:port) allowed to call /api/** from a browser, comma-separated
    # 8080 = Web UI served by nginx, 5173 = local UI dev server
    allowed-origins: http://localhost:8080,http://localhost:5173